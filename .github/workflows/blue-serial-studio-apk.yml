name: Build BlueSerialStudio APK

on:
  push:
    branches: [blue-serial-studio]
    paths:
      - 'payload/**'
      - 'patches/**'
      - '.github/workflows/blue-serial-studio-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore and verify source
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part01.b64 payload/part02.b64 payload/part03.b64 payload/part04.b64 | base64 --decode > BlueSerialStudio_source.tar.xz
          echo "f47103c17561179fcb3a5a98331e4ce4939b062bd84609b0fc987d070d6fc370  BlueSerialStudio_source.tar.xz" | sha256sum --check
          mkdir -p unpacked
          tar -xJf BlueSerialStudio_source.tar.xz -C unpacked
          test -f unpacked/settings.gradle
          test -f unpacked/app/src/main/AndroidManifest.xml
          echo "c9c76b6ad2f1c110f74be8f5654692ee7e378a385d6850dbd5bc2421c30358e3  patches/v1.1.patch.gz.b64" | sha256sum --check
          base64 --decode patches/v1.1.patch.gz.b64 | gzip -dc > v1.1.patch
          echo "e3a477a9e01e8f22a87f77a22423df728d5292cf5c3a3940661155adf8451ffc  v1.1.patch" | sha256sum --check
          (cd unpacked && git apply --check ../v1.1.patch && git apply ../v1.1.patch)
          echo "069a446ffe5f05c5a7729e09f18f5678e8dfaac53bcc588baa62d0dcb17a5b5d  patches/v1.2.patch.gz.b64" | sha256sum --check
          base64 --decode patches/v1.2.patch.gz.b64 | gzip -dc > v1.2.patch
          echo "4b2eebc43957b8f0f82c5139e7e83008c3cddeb2819210aec67f76d6d830f2bf  v1.2.patch" | sha256sum --check
          patch -d unpacked -p1 --forward --batch --dry-run < v1.2.patch
          patch -d unpacked -p1 --forward --batch < v1.2.patch
          test -f unpacked/qa/check_source.py
          test -f unpacked/tests/ProtocolSelfTest.java
          grep -F "versionName '1.2.0'" unpacked/app/build.gradle
          echo "4ec635f3735af80924a795684ced3a4a955a3739328f3104011aff852fcfdd62  patches/v1.3.patch.gz.b64" | sha256sum --check
          base64 --decode patches/v1.3.patch.gz.b64 | gzip -dc > v1.3.patch
          echo "3ac8a06a7483d137b8aeb98f8cbe49a85a02f105ca084159dfc101e8f35809f3  v1.3.patch" | sha256sum --check
          (cd unpacked && git apply --check ../v1.3.patch && git apply ../v1.3.patch)
          test -f unpacked/app/src/main/java/com/embedded/blueserial/DriveControlMath.java
          grep -F "versionName '1.3.0'" unpacked/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Regression checks (JVM and source)
        shell: bash
        working-directory: unpacked
        run: |
          set -euo pipefail
          python3 qa/check_source.py
          mkdir -p build/protocol-tests
          javac -d build/protocol-tests app/src/main/java/com/embedded/blueserial/SerialProtocol.java app/src/main/java/com/embedded/blueserial/DriveControlMath.java tests/ProtocolSelfTest.java
          java -cp build/protocol-tests ProtocolSelfTest

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: unpacked
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueSerialStudio-v1.3-debug-apk
          path: unpacked/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to dedicated branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          cp unpacked/app/build/outputs/apk/debug/app-debug.apk downloads/BlueSerialStudio-v1.3-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p BlueSerialStudio
          tar -C unpacked --exclude='.gradle' --exclude='*/build' --exclude='build' -cf - . | tar -C BlueSerialStudio -xf -
          git add BlueSerialStudio downloads/BlueSerialStudio-v1.3-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "build: publish downloadable BlueSerialStudio APK"
            git push origin HEAD:blue-serial-studio
          fi

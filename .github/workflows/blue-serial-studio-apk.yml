name: Build BlueSerialStudio APK

on:
  push:
    branches: [blue-serial-studio]
    paths:
      - 'payload/**'
      - 'patches/**'
      - '.github/workflows/blue-serial-studio-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore v1.2 and apply v1.3 plus v1.4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unpacked
          cp -a BlueSerialStudio/. unpacked/
          test -f unpacked/settings.gradle
          grep -F "versionName '1.2.0'" unpacked/app/build.gradle
          echo "4ec635f3735af80924a795684ced3a4a955a3739328f3104011aff852fcfdd62  patches/v1.3.patch.gz.b64" | sha256sum --check
          base64 --decode patches/v1.3.patch.gz.b64 | gzip -dc > v1.3.patch
          echo "3ac8a06a7483d137b8aeb98f8cbe49a85a02f105ca084159dfc101e8f35809f3  v1.3.patch" | sha256sum --check
          patch -d unpacked -p1 --forward --batch --dry-run < v1.3.patch
          patch -d unpacked -p1 --forward --batch < v1.3.patch
          echo "220522c0736f9b246aa93b6d8f05532517e27fdf5c4ee954fee49e863d5b153c  patches/v1.4.patch.gz.b64" | sha256sum --check
          base64 --decode patches/v1.4.patch.gz.b64 | gzip -dc > v1.4.patch
          echo "7a2991850c0eeb67d0ee08115af9ad0731dca89ad1fca8ac53eef0d7d6c82809  v1.4.patch" | sha256sum --check
          patch -d unpacked -p1 --forward --batch --dry-run < v1.4.patch
          patch -d unpacked -p1 --forward --batch < v1.4.patch
          grep -F "versionName '1.4.0'" unpacked/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Regression checks (JVM and source)
        shell: bash
        working-directory: unpacked
        run: |
          set -euo pipefail
          python3 qa/check_source.py
          mkdir -p build/protocol-tests
          javac -d build/protocol-tests app/src/main/java/com/embedded/blueserial/SerialProtocol.java app/src/main/java/com/embedded/blueserial/DriveControlMath.java tests/ProtocolSelfTest.java
          java -cp build/protocol-tests ProtocolSelfTest
          gcc -std=c99 -Wall -Wextra -Werror tests/drive_mixer_test.c -o build/protocol-tests/mixer_test
          build/protocol-tests/mixer_test

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: unpacked
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueSerialStudio-v1.4-debug-apk
          path: unpacked/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to dedicated branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          cp unpacked/app/build/outputs/apk/debug/app-debug.apk downloads/BlueSerialStudio-v1.4-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p BlueSerialStudio
          tar -C unpacked --exclude='.gradle' --exclude='*/build' --exclude='build' -cf - . | tar -C BlueSerialStudio -xf -
          git add BlueSerialStudio downloads/BlueSerialStudio-v1.4-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "build: publish downloadable BlueSerialStudio APK"
            git push origin HEAD:blue-serial-studio
          fi

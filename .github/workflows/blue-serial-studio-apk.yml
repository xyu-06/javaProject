name: Build BlueSerialStudio APK

on:
  push:
    branches: [blue-serial-studio]
    paths:
      - 'payload/**'
      - '.github/workflows/blue-serial-studio-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore and verify source
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part01.b64 payload/part02.b64 payload/part03.b64 payload/part04.b64 | base64 --decode > BlueSerialStudio_source.tar.xz
          echo "f47103c17561179fcb3a5a98331e4ce4939b062bd84609b0fc987d070d6fc370  BlueSerialStudio_source.tar.xz" | sha256sum --check
          mkdir -p unpacked
          tar -xJf BlueSerialStudio_source.tar.xz -C unpacked
          test -f unpacked/settings.gradle
          test -f unpacked/app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: unpacked
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueSerialStudio-debug-apk
          path: unpacked/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
